x3plus_base:
  ros__parameters:
    port: /dev/rosmaster
    car_type: 2
    command_topic: vel_raw
    feedback_velocity_topic: chassis/velocity_raw
    odom_topic: odom_raw
    imu_topic: imu/data_raw
    voltage_topic: voltage
    odom_frame: odom
    base_frame: base_footprint
    imu_frame: imu_link
    publish_rate: 20.0
    command_timeout: 0.3
    feedback_timeout: 0.3
    max_linear_x: 0.2
    max_linear_y: 0.2
    max_angular_z: 0.6
    linear_scale_x: 1.0
    linear_scale_y: 1.0
