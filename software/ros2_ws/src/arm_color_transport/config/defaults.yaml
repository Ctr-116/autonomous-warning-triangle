    marker_topic: color_end_pose
    start_point_topic: start_point
    clicked_point_topic: clicked_point
    cancel_topic: color_transport/cancel
    frame_id: map
    gui: false
    rate_hz: 10.0

transport_main:
  ros__parameters:
    camera_topic: image_in
    transport_rgb_topic: Transport/rgb
    marker_topic: color_end_pose
    rgb_light_topic: RGBLight
